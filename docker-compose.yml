version: '3.9'

services:

  php:
    image: php:8.4-fpm
    container_name: honey_php

    working_dir: /var/www/html

    volumes:
      - ./backend:/var/www/html

    command: >
      bash -c "
      apt-get update &&
      apt-get install -y libicu-dev &&
      docker-php-ext-install pdo pdo_mysql intl &&
      php-fpm
      "

  nginx:
    image: nginx:stable-alpine
    container_name: honey_nginx

    ports:
      - "8000:80"

    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - php

  mysql:
    image: mysql:8
    container_name: honey_mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: honeygroup
      MYSQL_USER: honey
      MYSQL_PASSWORD: honeypass

    ports:
      - "3307:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: honey_phpmyadmin

    restart: always

    ports:
      - "8080:80"

    environment:
      PMA_HOST: mysql

    depends_on:
      - mysql